# Field help shown as tooltips in the form pages.
# Healthcare extension descriptions are quoted from the MedBiquitous Healthcare LOM Specification v1.1
# (ANSI/MEDBIQ LO.10.1-2008), Copyright MedBiquitous Consortium. LOM descriptions summarize IEEE 1484.12.1.

# --- 1 General
identifier = 1.1 A globally unique label that identifies this learning object: a catalog (identification scheme, e.g. URI, ISBN, DOI) and an entry within it.
title = 1.2 Name given to this learning object.
language = The primary human language used, as a language tag such as en-US or fr (ISO 639 language, optional ISO 3166 country).
description = 1.4 A textual description of the content of this learning object.
keyword = 1.5 A keyword or phrase describing the topic of this learning object. HLOM: use the Source and ID columns to reference a clinical terminology such as MeSH, SNOMED or UMLS (e.g. MeSH D009203).
coverage = 1.6 The time, culture, geography or region to which this learning object applies.
structure = 1.7 Underlying organizational structure of this learning object.
aggregationLevel = 1.8 The functional granularity of this learning object (1 = raw media, 4 = largest, e.g. a course or set of courses).

# --- 2 Life Cycle
version = 2.1 The edition of this learning object.
status = 2.2 The completion status or condition of this learning object.
contribute = 2.3 Entities (people, organizations) that have contributed to the state of this learning object during its life cycle. HLOM: use the date of the publisher's contribution as release date and the reviewer's as review date.
role = Kind of contribution. HLOM adds the roles reviewer, programmer, producer, director and other.
entity = The contributing person or organization, as a vCard (BEGIN:VCARD ... END:VCARD).
date = The date of the contribution (YYYY, YYYY-MM-DD or YYYY-MM-DDThh:mm:ss with optional time zone).

# --- 3 Meta-Metadata
metaIdentifier = 3.1 A globally unique label that identifies this metadata record.
metaContribute = 3.2 Entities that have affected the state of this metadata record (creator, validator).
metadataSchema = 3.3 The metadata specifications this record conforms to. HLOM requires LOMv1.0 and HEALTHCARE_LOMv1 (and SCORM_CAM_v1.3 if applicable).
metaLanguage = 3.4 Language of this metadata record; the default for strings without a language attribute.

# --- 4 Technical
format = 4.1 Technical data type(s) of the components of this learning object, as MIME types (or "non-digital").
size = 4.2 The size of the digital learning object in bytes.
location = 4.3 A string (usually a URL) used to access this learning object.
requirement = 4.4 The technical capabilities necessary for using this learning object. All conditions of a requirement are alternatives (OR).
installationRemarks = 4.5 Description of how to install this learning object.
otherPlatformRequirements = 4.6 Information about other software and hardware requirements.
duration = 4.7 Time a continuous learning object takes when played at intended speed, as an ISO 8601 duration such as PT1H30M.

# --- 5 Educational
educational = 5 Key educational or pedagogic characteristics of this learning object. A record may describe several educational uses.
interactivityType = 5.1 Predominant mode of learning supported (active, expositive or mixed).
learningResourceType = 5.2 Specific kind of learning object. HLOM adds animation, audio, case study, collaborative forum, game, image, reference, tutorial, video and virtual patient.
interactivityLevel = 5.3 The degree of interactivity.
semanticDensity = 5.4 The degree of conciseness of this learning object.
intendedEndUserRole = 5.5 Principal user(s) for which this learning object was designed.
context = 5.6 The principal environment within which use of this learning object is intended. HLOM adds patient, caregiver and professional education contexts.
typicalAgeRange = 5.7 Age of the typical intended user, e.g. 7-9 or 18-.
difficulty = 5.8 How hard it is to work with this learning object for the typical intended audience.
typicalLearningTime = 5.9 Approximate or typical time it takes to work with this learning object (ISO 8601 duration, e.g. PT45M).
educationalDescription = 5.10 Comments on how this learning object is to be used.
educationalLanguage = 5.11 The human language used by the typical intended user.

# --- 6 Rights
cost = 6.1 Whether use of this learning object requires payment.
copyrightAndOtherRestrictions = 6.2 Whether copyright or other restrictions apply to the use of this learning object.
rightsDescription = 6.3 Comments on the conditions of use of this learning object.

# --- 7 Relation
relation = 7 Relationships between this learning object and other learning objects.
kind = 7.1 Nature of the relationship between this learning object and the target learning object.
resource = 7.2 The target learning object of this relationship, identified by catalog and entry.

# --- 8 Annotation
annotation = 8 Comments on the educational use of this learning object, with information on when and by whom they were created.

# --- 9 Classification
classification = 9 Describes where this learning object falls within a classification system. HLOM uses classification for curriculum classification, educational objectives, competencies (e.g. ACGME), learning outcomes, guidelines, drug lists and levels of evidence.
purpose = 9.1 The purpose of classifying this learning object. HLOM adds clinical guideline, drug list, level of evidence and learning outcome.
taxonPath = 9.2 A taxonomic path in a specific classification system, from the most general to the most specific taxon.
taxonSource = 9.2.1 The name of the classification system, e.g. ACGME Core Competencies or MeSH.
taxon = 9.2.2 A particular term within the taxonomy: an identifier and a textual label.

# --- Healthcare (quoted from the HLOM specification)
healthcareMetadata = healthcareMetadata contains metadata specific to healthcare education. healthcareMetadata must occur once if Healthcare LOM is being used.
healthcareEducation = healthcareEducation is the subelement of healthcareMetadata and defines healthcare specific metadata for educational offerings.
expirationDate = expirationDate indicates the date after which this educational offering is no longer considered valid.
creditsAvailable = creditsAvailable indicates whether or not credits are offered for the educational offering.
credits = credits defines the credits that may be awarded for this educational offering. If an activity is certified for more than one type of credit (i.e. CME and CNE), add one credits entry per type of credit.
targetAudience = targetAudience contains subelements that describe the target audience for this educational offering.
activityLocation = activityLocation indicates the geographical location in which an in person activity takes place.
startDateTime = startDateTime indicates the date and time that a live activity begins.
endDateTime = endDateTime indicates the date and time that a live activity ends.
activitySponsorship = activitySponsorship indicates the accredited provider's role in planning and presenting the activity. Direct: the accredited provider planned and presented the activity directly. Joint: together with a non-accredited provider.
participationModality = participationModality defines the learner's mode of participation, dictated by the activity medium.
activityDelivery = activityDelivery indicates the temporal nature of the activity.
activityFormat = activityFormat describes the type of learning activity described.
offLabelUse = offLabelUse indicates whether or not this educational offering references off label usage of a drug.
offLabelDescription = offLabelDescription describes any off label drug use referenced in this educational offering.
commercialSupport = commercialSupport indicates the existence of any commercial support, from a manufacturer of a commercial product.
commercialSupportAcknowledgement = commercialSupportAcknowledgement describes the commercial support provided from a manufacturer of a commercial product.
relevantFinancialRelationship = relevantFinancialRelationship indicates the existence of any relevant financial interest or other relationship of a faculty member or other person in a position to influence the activity content with the manufacturer of any commercial product referenced in this activity.
relevantFinancialRelationshipDisclosure = relevantFinancialRelationshipDisclosure describes any relevant financial interest or other relationship of a faculty member or other person in a position to influence the activity content with the manufacturer of any commercial product referenced in this activity.
contact = Contact identifies the person or organization that serves as the main point of contact for questions about the learning content.
accreditingBody = accreditingBody identifies the organization that sets the quality standards for continuing education and is the source of the accreditation process for the provider of this educational activity.
activityCertification = activityCertification identifies the category of credit awarded for the activity by the accredited medical education organization.
creditType = creditType indicates which type of credit is awarded for this educational activity.
creditUnit = creditUnit indicates the unit of credit for this credit definition.
pacing = pacing indicates who controls the pacing of the activity.
accreditedProvider = accreditedProvider defines the entity serving as the accredited provider for this activity.
nonAccreditedProvider = nonAccreditedProvider defines an educational provider for this activity that is not the accredited provider. Jointly sponsored activities have a non-accredited provider.
releaseDate = releaseDate identifies the date this activity becomes available for credit.
creditExpirationDate = expirationDate identifies the date that the activity ceases to be available for credit.
numberOfCredits = numberOfCredits identifies the number of continuing education credits associated with this learning activity.
audienceCategory = audienceCategory describes the intended audience for the educational offering in broad terms.
profession = profession describes the health profession for which this educational offering is intended. For example, physician, registered nurse, etc.
specialty = specialty describes healthcare specialties within a profession that compose part of the target audience for this educational offering. For example, cardiology.
readingLevel = readingLevel describes the primary/secondary school grade reflecting the reading level of the target audience. This is normally used for non-professional education.
room = Room defines the room in which an activity takes place.
building = Building defines the building in which an activity takes place.
country = The country of the activity location. The MedBiquitous address schema requires a country (name and/or ISO 3166 code) whenever an activity location is given.
healthcareAsset = healthcareAsset provides more information about images and other files that contribute to the creation of an educational offering.
annotated = annotated indicates whether or not this resource features an annotated or labeled image.
clinicalHistory = clinicalHistory describes the clinical history of the patient or subject described in this resource.
magnification = magnification describes the magnification of microscopic image(s) found in this resource. For example, 100.
orientation = orientation describes the orientation of image(s) found in this resource.
medicalImageType = medicalImageType describes the type of image, radiological or otherwise, featured in this resource.
specimenType = specimenType describes the type of specimen featured in this resource.
fileHeight = fileHeight describes the height of the image in pixels.
fileWidth = fileWidth describes the width of the image in pixels.

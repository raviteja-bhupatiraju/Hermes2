# Default preferences of Hermes 2.
# Show the splash progress bar while starting.
org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP=true
# Traditional (non-curved) tabs are handled by the CSS theme.
org.eclipse.ui/SHOW_TRADITIONAL_STYLE_TABS=false
# Show the heap status (memory in use; click it to run the garbage collector) in the status bar.
org.eclipse.ui/SHOW_MEMORY_MONITOR=true
# Keep the workspace in sync with changes made outside the application (other editors, file managers, Git).
org.eclipse.core.resources/refresh.enabled=true
org.eclipse.core.resources/refresh.lightweight.enabled=true
# Git (EGit) is optional: no first-start warning about the HOME variable on Windows (Git uses the user folder).
org.eclipse.egit.ui/show_home_drive_warning=false
# The update site (p2 repository) of Hermes 2 for Help > Check for Updates, e.g. https://example.org/hermes2/updates
# (also -Dhermes.update.site=... in Hermes2.ini); empty: sites are added in Preferences > Install/Update.
edu.louisiana.caai.lom.editor/updates.site=
